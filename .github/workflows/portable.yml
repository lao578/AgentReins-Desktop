name: Portable runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python portable collector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s Tests/Portable -p 'test_*.py'
      - name: Smoke test
        shell: bash
        run: python portable/agentreins_portable.py paths
      - name: Install Linux GUI smoke dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb
      - name: Linux desktop smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python portable/desktop_smoke.py
      - name: Windows desktop smoke test
        if: runner.os == 'Windows'
        run: python portable/desktop_smoke.py

  windows-executable:
    name: Windows desktop executable
    runs-on: windows-2025
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build AgentReins.exe
        shell: pwsh
        run: .\portable\build-windows.ps1 -Clean
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AgentReins-Windows-x64
          path: |
            dist/AgentReins.exe
            dist/AgentReinsNativeHost.exe
          if-no-files-found: error
