name: Windows and Linux release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller pystray Pillow
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.Substring(1) } else { $version = '0.1.1-dev' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Prepare optional Authenticode signing
        id: windows-signing
        shell: pwsh
        env:
          SIGN_CERT_P12: ${{ secrets.WINDOWS_SIGNING_CERT_P12 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          IS_PUBLIC_RELEASE: ${{ github.ref_type == 'tag' }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGN_CERT_P12)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGN_CERT_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Configure both WINDOWS_SIGNING_CERT_P12 and WINDOWS_SIGNING_CERT_PASSWORD, or neither.'
          }
          if (-not $hasCertificate) {
            'has_signing=false' >> $env:GITHUB_OUTPUT
            if ($env:IS_PUBLIC_RELEASE -eq 'true') {
              Write-Host 'No Authenticode secrets configured; Windows tag artifacts will be unsigned.'
            } else {
              Write-Host 'No Authenticode secrets configured; development artifacts will be unsigned.'
            }
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'agentreins-codesign.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGN_CERT_P12))
          "AGENTREINS_WINDOWS_SIGN_CERT=$certificate" >> $env:GITHUB_ENV
          'has_signing=true' >> $env:GITHUB_OUTPUT
      - name: Install .NET 8 SDK for optional ETW helper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build optional ETW helper
        shell: pwsh
        env:
          AGENTREINS_WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          AGENTREINS_WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: .\windows\AgentReinsEtw\build.ps1
      - name: Build installer
        shell: pwsh
        env:
          AGENTREINS_VERSION: ${{ steps.version.outputs.version }}
          AGENTREINS_WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: .\installers\windows\build-installer.ps1
      - name: Report Windows signature status
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ steps.windows-signing.outputs.has_signing }}
        run: |
          $files = @('dist/AgentReins.exe', 'dist/AgentReinsNativeHost.exe', 'dist/etw-helper/AgentReinsEtwHelper.exe') + @(Get-ChildItem dist/installer/*.exe | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($env:EXPECT_SIGNED -eq 'true') {
              if ($signature.Status -ne 'Valid') { throw "Expected a valid Authenticode signature for $file, got $($signature.Status)" }
              Write-Host "$file : Authenticode valid ($($signature.SignerCertificate.Thumbprint))"
            } else {
              Write-Host "$file : $($signature.Status) (unsigned release build)"
            }
          }
      - name: Create Windows checksums
        shell: pwsh
        run: |
          Get-FileHash dist/AgentReins.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  AgentReins.exe" } | Set-Content -NoNewline dist/AgentReins.exe.sha256
          Get-FileHash dist/AgentReinsNativeHost.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  AgentReinsNativeHost.exe" } | Set-Content -NoNewline dist/AgentReinsNativeHost.exe.sha256
          Get-FileHash dist/etw-helper/AgentReinsEtwHelper.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  AgentReinsEtwHelper.exe" } | Set-Content -NoNewline dist/etw-helper/AgentReinsEtwHelper.exe.sha256
          Get-ChildItem dist/installer/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -NoNewline -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
          }
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentReins-Windows-x64-Setup
          path: |
            dist/AgentReins.exe
            dist/AgentReins.exe.sha256
            dist/AgentReinsNativeHost.exe
            dist/AgentReinsNativeHost.exe.sha256
            dist/etw-helper/AgentReinsEtwHelper.exe
            dist/etw-helper/AgentReinsEtwHelper.exe.sha256
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $found = $false
          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) { $found = $true; break }
            Start-Sleep -Seconds 20
          }
          if (-not $found) { throw "Release $env:GITHUB_REF_NAME was not created in time" }
          gh release upload $env:GITHUB_REF_NAME dist/AgentReins.exe dist/AgentReins.exe.sha256 dist/AgentReinsNativeHost.exe dist/AgentReinsNativeHost.exe.sha256 dist/etw-helper/AgentReinsEtwHelper.exe dist/etw-helper/AgentReinsEtwHelper.exe.sha256 dist/installer/*.exe dist/installer/*.sha256 --clobber

  linux-packages:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk dpkg-dev
          python -m pip install --upgrade pyinstaller pystray Pillow
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.1.1-dev"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux packages
        env:
          AGENTREINS_VERSION: ${{ steps.version.outputs.version }}
        run: ./portable/package-linux.sh all
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentReins-Linux-packages
          path: |
            dist/AgentReins-*.AppImage
            dist/AgentReins-*.AppImage.sha256
            dist/AgentReins-*.deb
            dist/AgentReins-*.deb.sha256
          if-no-files-found: error
      - name: Attach packages to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            if [[ "$attempt" == 90 ]]; then echo "Release $GITHUB_REF_NAME was not created in time" >&2; exit 1; fi
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" \
            dist/AgentReins-*.AppImage dist/AgentReins-*.AppImage.sha256 \
            dist/AgentReins-*.deb dist/AgentReins-*.deb.sha256 --clobber
